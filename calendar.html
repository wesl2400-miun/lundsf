<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO optimering -->
    <meta name="description" content="Boka färdtjänst. Välj år, månad, dag och tid för dina serviceresor inom Lunds kommun.">
    <title>Boka färdtjänst - Välj år, månad, dag och tid | Lunds Färdtjänst</title>

    <!-- Favoritikon -->
    <link rel="icon" href="./assets/favicon.svg">

    <!-- Prestanda optimering -->
    <link rel="modulepreload" href="./script/views/menu.js" as="script" crossorigin>

    <!-- Kör logiken bakom den hopfällbara menyn -->
    <script type="module" src="./script/views/menu.js"></script>

    <!-- Laddar CSS stilar -->
    <link rel="stylesheet" href="./styles/root.css">
    <link rel="stylesheet" href="./styles/logo.css">
    <link rel="stylesheet" href="./styles/nav.css">
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="./styles/headline.css">
    <link rel="stylesheet" href="./styles/card.css">
    <link rel="stylesheet" href="./styles/toolbar.css">
    <link rel="stylesheet" href="./styles/prim-btn.css">
    <link rel="stylesheet" href="./styles/prim-var-btn.css">
    <link rel="stylesheet" href="./styles/calendar.css">
    <link rel="styles" href="./styles/view-holder.css">

    <!-- Laddar teckensnitt från Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Semi+Expanded:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Sidhuvud -->
    <header>
      <div class="logo">
        <a aria-label="Lunds Färdtjänst logotyp, navigera till startsidan." href="./index.html">
          <img height="40" width="253" src="./assets/logo.svg" alt="">
        </a>
      </div>

      <!-- Aria-label är avsedd för blinda och ska läsas av skärmläsare, aria-live meddelar när menyn öppnas -->
      <nav class="nav" aria-live="polite">
        <!-- Navigeringsmeny -->
        <div id="menu">
          <button id="menu-btn" aria-label="Öppna menyn">
            <img width="40" height="40" src="./assets/menu-closed.svg" alt="">
          </button>
        </div>

        <!-- Navigeringsrutter -->
        <ul id="routes" aria-label="Navigera till">
          <li class="route--selected" aria-current="page"><a href="./index.html">Boka färdtjänst</a></li>
          <li><a href="./profile.html">Mina Sidor</a></li>
          <li><a href="./about.html">Om färdtjänst</a></li>
          <li><a href="./contact.html">Kontakta oss</a></li>
        </ul>
      </nav>
    </header>

    <!-- Huvudinnehåll -->
    <main id="main">
      <h1 class="headline">Boka färdtjänst</h1>

      <section id="view-holder" class="card" aria-live="polite">
        <!-- Kalenderknappar genereras dynamiskt via calendar.js skript -->
      </section>

      <div class="toolbar">
        <button class="prim-btn" id="act-btn">NÄSTA</button>
        <button class="prim-var-btn" id="dec-btn">TILLBAKA</button>
      </div>
    </main>

    <footer><a class="link" href="./accessibility.html">Tillgänglighetsredogörelsen</a></footer>

    <script type="module" src="./script/views/calendar-view.js"></script>
  </body>
</html>
