<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO optimering -->
    <meta name="description" content="Boka färdtjänst. Kontakta oss angående serviceresor inom Lunds kommun.">
    <title>Kontakta oss - Ring och mejla oss vid frågor | Lunds Färdtjänst</title>

    <!-- Favoritikon -->
    <link rel="icon" href="./assets/favicon.svg">

    <!-- Laddar CSS stilar -->
    <link rel="stylesheet" href="./styles/root.css">
    <link rel="stylesheet" href="./styles/logo.css">
    <link rel="stylesheet" href="./styles/nav.css">
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="./styles/headline.css">
    <link rel="stylesheet" href="./styles/card.css">

    <!-- Laddar teckensnitt från Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Semi+Expanded:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Sidhuvud -->
    <header>
      <div class="logo">
        <a aria-label="Lunds Färdtjänst logotyp, navigera till startsidan." href="./index.html">
          <img src="./assets/logo.svg" alt="">
        </a>
      </div>

      <!-- Navigeringsfältet - aria-label är avsedd för blinda och ska läsas av skärmläsare -->
      <nav class="nav">
        <!-- Navigeringsmeny -->
        <div id="menu">
          <button id="menu-btn" aria-label="Öppna menyn">
            <img src="./assets/menu-closed.svg" alt="">
          </button>
        </div>

        <!-- Navigeringsrutter -->
        <ul id="routes" aria-label="Navigera till">
          <li><a href="./index.html">Boka färdtjänst</a></li>
          <li><a href="./profile.html">Mina Sidor</a></li>
          <li><a href="./about.html">Om färdtjänst</a></li>
          <li class="route--selected" aria-current="page"><a href="./contact.html">Kontakta oss</a></li>
        </ul>
      </nav>
    </header>

    <!-- Huvudinnehåll -->
    <main id="main">
      <h1 class="headline">Kontakta oss</h1>

      <section class="card">
        <h2>Kontaktuppgifter</h2>
        <p>Du kan kontakta oss närsomhelst via e-post. Telefonsamtal tar vi emot mellan kl. 9.00-16.00</p>
      </section>
      
      <section class="card">
        <h3>E-post</h3>
        <p>kundservice@lundsf.com</p>
      </section>

      <section class="card">
        <h3>Telefonnummer</h3>
        <p>+46 777 777 777</p>
      </section>
      
    </main>

    <!-- Kör logiken bakom den hopfällbara menyn -->
    <script type="module" defer src="./script/views/menu.js"></script>

  </body>
</html>
