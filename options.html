<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO optimering -->
    <meta name="description" content="Boka färdtjänst. Boka återkommande serviceresor inom Lunds kommun. Anpassa din resa för rullstol eller ledarhund.">
    <title>Boka färdtjänst - Anpassa din serviceresa | Lunds Färdtjänst</title>

    <!-- Favoritikon -->
    <link rel="icon" href="./assets/favicon.svg">

    <!-- Laddar CSS stilar -->
    <link rel="stylesheet" href="./styles/root.css">
    <link rel="stylesheet" href="./styles/logo.css">
    <link rel="stylesheet" href="./styles/nav.css">
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="./styles/headline.css">
    <link rel="stylesheet" href="./styles/card.css">
    <link rel="stylesheet" href="./styles/toolbar.css">
    <link rel="stylesheet" href="./styles/prim-btn.css">
    <link rel="stylesheet" href="./styles/prim-var-btn.css">
    <link rel="stylesheet" href="./styles/check-btn.css">

    <!-- Laddar teckensnitt från Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Semi+Expanded:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Sidhuvud -->
    <header>
      <div class="logo">
        <a aria-label="Lunds Färdtjänst logotyp, navigera till startsidan." href="./index.html">
          <img src="./assets/logo.svg" alt="">
        </a>
      </div>

      <!-- Navigeringsfältet - aria-label är avsedd för blinda och ska läsas av skärmläsare -->
      <nav class="nav">
        <!-- Navigeringsmeny -->
        <div id="menu">
          <button id="menu-btn" aria-label="Öppna menyn">
            <img src="./assets/menu-closed.svg" alt="">
          </button>
        </div>

        <!-- Navigeringsrutter -->
        <ul id="routes" aria-label="Navigera till">
          <li class="route--selected" aria-current="page"><a href="./index.html">Boka färdtjänst</a></li>
          <li><a href="./profile.html">Mina Sidor</a></li>
          <li><a href="./about.html">Om färdtjänst</a></li>
          <li><a href="./contact.html">Kontakta oss</a></li>
        </ul>
      </nav>
    </header>

    <!-- Huvudinnehåll -->
    <main id="main">
      <h1 class="headline">Boka färdtjänst</h1>

      <section class="card">

        <form class="check-btns">
          <fieldset>
            <legend>Är resa återkommande?</legend>

            <div class="check-opt">
              <input 
                id="no-roundtrip" 
                class="check-btn" 
                type="radio"
                name="round-trip" 
                value="Nej">
              <label for="no-roundtrip">Nej</label>
            </div>

            <div class="check-opt">
              <input 
                id="each-week" 
                class="check-btn" 
                type="radio"
                name="round-trip" 
                value="Varj vecka">
              <label for="each-week">Varje vecka</label>
            </div>

            <div class="check-opt">
              <input 
                id="every-second-week" 
                class="check-btn" 
                type="radio"
                name="round-trip" 
                value="Varannan vecka">
              <label for="every-second-week">Varannan vecka</label>
            </div>

            <div class="check-opt">
              <input 
                id="each-month" 
                class="check-btn" 
                type="radio"
                name="round-trip" 
                value="Varje månad">
              <label for="each-week">Varje månad</label>
            </div>

          </fieldset>

          <fieldset>
            <legend>Övrigt</legend>

            <div class="check-opt">
              <input 
                id="wheel-chair" 
                class="check-btn" 
                type="checkbox"
                name="extras" 
                value="Jag har rullstol">
              <label for="wheel-chair">Jag har rullstol</label>
            </div>

            <div class="check-opt">
              <input 
                id="dog-assistant" 
                class="check-btn" 
                type="checkbox"
                name="extras" 
                value="Jag har ledarhund">
              <label for="dog-assistant">Jag har ledarhund</label>
            </div>
            
          </fieldset>
        </form>
      </section>

    </main>

    <!-- Kör logiken bakom den hopfällbara menyn -->
    <script type="module" defer src="./script/views/menu.js"></script>

    <script type="module" defer src="./script/views/options-view.js"></script>
  </body>
</html>
